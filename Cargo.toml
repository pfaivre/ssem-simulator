[package]
name = "ssem-simulator"
version = "1.1.0"
edition = "2024"
description = "Advanced simulator of the Small-Scale Experimental Machine from 1948."
repository = "https://github.com/pfaivre/ssem-simulator"
homepage = "https://github.com/pfaivre/ssem-simulator"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
rust-i18n = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
