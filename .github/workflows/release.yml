name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dist-linux
          - os: windows-latest
            artifact: dist-windows
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Package binary and samples
      shell: bash
      run: ./scripts/package.sh

    - name: Upload packaged zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
    # Full history and tags: the release notes diff against the previous v* tag
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download packaged zips
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    # generate_release_notes only lists merged PRs, so build the bullet list
    # ourselves to include direct pushes too.
    - name: Generate release notes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/generate-release-notes.sh release_notes.md

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        body_path: release_notes.md
