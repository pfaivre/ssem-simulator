# Traductions françaises. Mêmes clés que locales/en.toml.
# Non traduits : les mnémoniques d'opcodes (JMP, LDN, ...), le mot-clé NUM
# des fichiers .asm/.snp, les noms de registres CI et A, les extensions de
# fichiers, les clés du fichier de configuration et les commentaires des
# fichiers .asm.

[cli]
about = "Simulateur avancé de la Small-Scale Experimental Machine de 1948."

[cli.help]
max_cycles = "Arrêter après ce nombre de cycles"
headless = "Exécuter sans l'interface interactive (TUI) ; afficher l'état final et quitter"
history_size = "Nombre d'états passés de la machine conservés pour le voyage dans le temps dans l'interface interactive (0 pour désactiver)"
theme = "Thème de couleurs de l'interface interactive, prioritaire sur celui du fichier de configuration pour cette session (la touche T fait défiler les thèmes à l'exécution)"
lang = "Langue de l'interface, prioritaire sur celle du fichier de configuration pour cette session"
save = "Écrire l'état de la machine dans ce fichier à la fin de l'exécution (.asm ou .snp, avec les commentaires source) ; dans l'interface interactive, la touche S sauvegarde l'état courant à tout moment"
file = "Fichier d'entrée pour initialiser la mémoire. Peut être au format .asm ou .snp. Sans fichier, la machine démarre avec une mémoire vide (tous les mots à zéro)"

[main]
final_state = "État final de la machine :"
saved = "État de la machine sauvegardé dans %{path}"
save_error = "Erreur : impossible de sauvegarder dans %{path} : %{error}"
history_clamped = "Attention : --history-size %{given} est trop grand, limité à %{max} (max ~14,8 Go)"
error = "Erreur : %{error}"
tty_hint = "L'interface interactive nécessite un terminal. Lancez ce programme dans un TTY, ou utilisez --headless."
warning = "Attention : %{message}"

[menu]
quit = "Quitter"
clear = "Effacer"
save = "Sauver"
run_stop = "Marche/Arrêt"
run = "Marche"
stop = "Arrêt "
step = "Pas"
settings = "Réglages"
help = "Aide"

