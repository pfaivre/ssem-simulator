# English translations: the source of truth for all interface strings.
# Other languages live in locales/<code>.toml with exactly the same keys.
# Placeholders use %{name} and are filled with t!("key", name = value);
# a format spec can follow the value: t!("key", n = 5 : {:02}).
#
# Not translated on purpose: opcode mnemonics (JMP, LDN, ...), the NUM
# keyword of .asm/.snp files, the register names CI and A, file extensions,
# config-file keys, and the comments stored in .asm files.

[cli]
about = "Advanced simulator of the Small-Scale Experimental Machine from 1948."

[cli.help]
max_cycles = "Stop after this amount of cycles"
headless = "Run without the interactive TUI; print the final state and exit"
history_size = "Number of past machine states kept for time-travel in the interactive interface (0 to disable)"
theme = "Color theme of the interactive interface, overriding the one saved in the config file for this session (the T key cycles themes at runtime)"
lang = "Language of the interface, overriding the one saved in the config file for this session"
save = "Write the machine state to this file once the run ends (.asm or .snp, with the source comments); in the interactive interface, the S key saves the current state at any time"
file = "Input file to initialize the store. Can be .asm or .snp format. When omitted, the machine starts with an empty (all-zero) store"

[main]
final_state = "Final state of the machine:"
saved = "Machine state saved to %{path}"
save_error = "Error: could not save to %{path}: %{error}"
history_clamped = "Warning: --history-size %{given} is too large, clamped to %{max} (~14.8 GB max)"
error = "Error: %{error}"
tty_hint = "The interactive interface requires a terminal. Run this program in a TTY, or use --headless."
warning = "Warning: %{message}"

